services:
  - type: web
    name: eregisteronweb-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/public/event
    envVars:
      - key: DEMO_MODE
        value: "true"
